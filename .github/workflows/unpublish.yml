# One-off maintenance workflow: unpublish a specific version via CI token
# (reuses secrets.NPM_TOKEN which has bypass-2FA publish rights).
# Trigger manually: Actions → Unpublish → Run workflow (set version).
name: Unpublish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name'
        required: false
        default: 'happier-ui'
        type: string
      version:
        description: 'Version to unpublish (e.g. 0.0.10)'
        required: true
        type: string

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Unpublish version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing repository secret NPM_TOKEN."
            exit 1
          fi
          npm unpublish ${{ inputs.package }}@${{ inputs.version }}
          echo "Unpublished ${{ inputs.package }}@${{ inputs.version }}"
